# A separate deployment and state namespace; never promote the lifecycle fixture.
name = "bugdrop-sdk-heartbeat"
main = "worker.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
# No routes until a concrete hostname is approved.
[vars]
FIXTURE_ENABLED = "false"
HEARTBEAT_BUILD = ""
[alias]
"@bugdrop/server" = "../../packages/server/dist/index.js"
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
[[durable_objects.bindings]]
name = "FIXTURE_STATE"
class_name = "FixtureState"
[[migrations]]
tag = "v1"
new_sqlite_classes = ["FixtureState"]
